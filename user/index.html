<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <link rel="stylesheet" href="../home/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #fcfcfe; }
        .user-wrapper { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .user-header { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 30px; margin-bottom: 30px; box-shadow: var(--shadow-card); }
        .user-avatar-lg { width: 80px; height: 80px; border-radius: 50%; background: var(--bg-light-purple); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--primary-purple); }
        .user-info h1 { font-size: 1.8rem; color: var(--primary-purple); margin-bottom: 5px; }
        .user-info p { color: var(--text-gray); }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 40px; }
        .dash-card { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 25px; text-align: center; transition: 0.2s; text-decoration: none; color: var(--text-main); }
        .dash-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
        .dash-card i { font-size: 2rem; color: var(--primary-purple); display: block; margin-bottom: 10px; }
        .dash-card h4 { font-weight: 600; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .set-card { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 20px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .set-card:hover { border-color: var(--light-purple); }
        .set-left h5 { font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .set-left p { font-size: 0.85rem; color: var(--text-gray); margin-top: 5px; }
        .btn-edit { background: var(--bg-light-purple); color: var(--primary-purple); padding: 6px 16px; border-radius: 20px; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: 0.2s; }
        .btn-edit:hover { background: var(--primary-purple); color: #fff; }
        @media (max-width: 768px) { .dashboard-grid, .settings-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-left"><div class="logo">AI项目生态</div>
            <nav class="menu">
                <a href="/home/index.html">首页</a>
                <a href="/works/index.html">作品库</a>
                <a href="/project/index.html">项目中心</a>
                <a href="/resource/index.html">资源中心</a>
            </nav>
        </div>
        <div class="nav-right">
            <a href="/home/index.html" style="color:var(--primary-purple);text-decoration:none;">返回首页</a>
        </div>
    </div>

    <div class="user-wrapper">
        <div class="user-header">
            <div class="user-avatar-lg"><i class="fa-regular fa-user"></i></div>
            <div class="user-info">
                <h1 id="uName">加载中...</h1>
                <p id="uRole">普通会员</p>
            </div>
        </div>

        <h3 style="color:var(--text-main);margin-bottom:15px;font-size:1.2rem;"><i class="fa-solid fa-chart-simple" style="color:var(--primary-purple);"></i> 数据概览</h3>
        <div class="dashboard-grid">
            <a href="/works/index.html" class="dash-card">
                <i class="fa-regular fa-folder-open"></i>
                <h4 id="myWorks">0</h4>
                <p>我的作品</p>
            </a>
            <a href="/project/index.html" class="dash-card">
                <i class="fa-regular fa-rectangle-list"></i>
                <h4 id="myProjects">0</h4>
                <p>参与的项目</p>
            </a>
            <a href="/resource/index.html" class="dash-card">
                <i class="fa-solid fa-box-open"></i>
                <h4 id="myResources">0</h4>
                <p>上传的资源</p>
            </a>
        </div>

        <h3 style="color:var(--text-main);margin-bottom:15px;font-size:1.2rem;"><i class="fa-solid fa-gear" style="color:var(--primary-purple);"></i> 个人设置</h3>
        <div class="settings-grid">
            <div class="set-card">
                <div class="set-left">
                    <h5><i class="fa-regular fa-user-pen"></i> 修改个人资料</h5>
                    <p>修改您的头像、昵称和个人签名</p>
                </div>
                <a href="/user/profile.html" class="btn-edit">去设置</a>
            </div>
            <div class="set-card">
                <div class="set-left">
                    <h5><i class="fa-solid fa-shield-halved"></i> 账号安全</h5>
                    <p>修改登录密码，账号绑定</p>
                </div>
                <a href="/user/security.html" class="btn-edit">去设置</a>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const userRes = await fetch('/api/auth/me');
                const userData = await userRes.json();
                if (userData.isLoggedIn) {
                    document.getElementById('uName').innerText = userData.user.name;
                }
                const statsRes = await fetch('/api/user/stats');
                const stats = await statsRes.json();
                document.getElementById('myWorks').innerText = stats.works || 0;
                document.getElementById('myProjects').innerText = stats.projects || 0;
                document.getElementById('myResources').innerText = stats.resources || 0;
            } catch (e) { console.warn("加载用户信息失败", e); }
        });
    </script>
</body>
</html>
