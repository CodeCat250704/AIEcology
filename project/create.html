<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布新动态</title>
    <!-- 引入新的全局项目中心样式 -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 发布页独立的细调 CSS */
        body { background: #f2f0f5; padding: 60px 20px; }
        .publish-card {
            max-width: 700px;
            margin: 0 auto;
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-hover);
            overflow: hidden;
        }
        .publish-header {
            padding: 30px 40px 0;
            border-bottom: 1px solid transparent;
        }
        .publish-header h2 { font-size: 1.6rem; font-weight: 700; color: var(--text-main); }
        .publish-header p { color: var(--text-gray); margin-top: 6px; }
        
        .publish-body { padding: 30px 40px; }
        .form-group { margin-bottom: 24px; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
        }
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
            background: var(--bg-white);
            color: var(--text-main);
        }
        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 4px rgba(74, 44, 109, 0.08);
        }
        .form-group textarea { min-height: 140px; resize: vertical; font-family: inherit; }
        
        .publish-footer { padding: 0 40px 40px; }
        .btn-submit-work {
            width: 100%;
            padding: 16px;
            background: var(--primary-purple);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(74, 44, 109, 0.2);
        }
        .btn-submit-work:hover { background: #3d235e; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="publish-card">
        <div class="publish-header">
            <h2>发布项目动态</h2>
            <p>选择类型，让社区参与你的项目成长。</p>
        </div>
        <form id="createForm" enctype="multipart/form-data">
            <div class="publish-body">
                <div class="form-group">
                    <label><i class="fa-solid fa-tag" style="margin-right:6px;color:var(--primary-purple);"></i>动态类型</label>
                    <select name="type" required>
                        <option value="recruit"><i class="fa-solid fa-users"></i> 招募/组队 (找人)</option>
                        <option value="report"><i class="fa-regular fa-newspaper"></i> 项目报告/进度</option>
                        <option value="collab"><i class="fa-solid fa-handshake"></i> 协作/资源互换</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" name="title" required placeholder="例如：寻找 AI 微调合作伙伴">
                </div>
                <div class="form-group">
                    <label>详细内容</label>
                    <textarea name="content" required placeholder="描述你的需求、项目进度、或者你能提供的资源..."></textarea>
                </div>
            </div>
            <div class="publish-footer">
                <button type="submit" class="btn-submit-work">发布动态</button>
            </div>
        </form>
    </div>
    <script src="create.js"></script>
</body>
</html>
