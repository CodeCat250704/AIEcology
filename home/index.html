<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI项目生态 - 首页</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <header class="navbar">
            <div class="nav-left">
                <div class="logo"><span class="logo-text">AI项目生态</span></div>
                <nav class="menu">
                    <a href="/home/index.html" class="active">首页</a>
                    <a href="/works/index.html">作品库</a>
                    <a href="/project/index.html">项目中心</a>
                    <a href="/resource/index.html">资源中心</a>
                    <a href="/legal/index.html">支持与规范</a>
                </nav>
            </div>
                    <div class="nav-right">
            <!-- 未登录状态 -->
            <a href="/gitin/index.html" class="btn-login" id="loginBtn">登录</a>
            
            <!-- 登录后状态 (默认隐藏) -->
            <div class="user-dropdown" id="userDropdown" style="display:none; align-items:center; gap:12px; cursor:pointer;">
                <a href="/user/index.html" id="userNameLink" style="text-decoration:none; color:var(--primary-purple);">
                    <span style="font-weight:500;" id="userNameDisplay">用户</span>
                </a>
                <a href="#" id="logoutBtn" style="font-size:0.85rem; color:#888; text-decoration:none; transition:0.2s; margin-left:5px;">退出</a>
            </div>
        </div>
        </header>

        <main class="main-content">
            
            <!-- 1. 轮播图/Banner区 -->
            <section class="banner-section" id="bannerContainer">
                <!-- JS 渲染 -->
            </section>

            <!-- 2. 每日最新消息 (时间轴) -->
            <section class="timeline-section">
                <h2 class="section-title">每日最新消息、创作</h2>
                <div class="timeline-container" id="timelineContainer">
                    <!-- JS 渲染 -->
                </div>
            </section>

            <!-- 3. 快捷入口区 -->
            <section class="quick-links" id="quickLinks">
                <!-- JS 渲染 -->
            </section>

            <!-- 4. 核心双栏 -->
            <div class="dashboard-grid">
                <!-- 左侧：论坛流 -->
                <div class="column left-column">
                    <div class="tabs-container" style="border-bottom: none; margin-bottom: 10px;">
                        <button class="tab-btn active" style="border-radius: 8px;">🔥 实时热帖</button>
                    </div>
                    <div class="forum-stream" id="forumStream">
                        <!-- JS 渲染 -->
                    </div>
                </div>

                <!-- 右侧：热门项目 (数据源改为 /works) -->
                <div class="column right-column">
                    <div class="card-header">
                        <h3>热门项目</h3>
                        <a href="/works/index.html" class="more-link">→ 详细</a>
                    </div>
                    <div class="hot-projects" id="hotProjects">
                        <!-- JS 渲染 -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
