<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传资源</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #fcfcfe; padding: 60px 20px; }
        .upload-card { max-width: 700px; margin: 0 auto; background: var(--bg-white); border: 1px solid var(--border-light); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 40px; }
        .upload-card h2 { font-weight: 700; margin-bottom: 8px; color: var(--primary-purple); }
        .upload-card p { color: var(--text-gray); margin-bottom: 30px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 16px; border: 1px solid var(--border-light); border-radius: var(--radius-md); outline: none; font-size: 1rem; transition: 0.2s; background: #faf9fc; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary-purple); background: #fff; box-shadow: 0 0 0 4px rgba(74, 44, 109, 0.08); }
        .form-group textarea { min-height: 120px; resize: vertical; font-family: inherit; }
        .file-upload-box { border: 2px dashed var(--border-light); border-radius: var(--radius-md); padding: 30px; text-align: center; background: var(--bg-light-purple); transition: 0.2s; }
        .file-upload-box:hover { border-color: var(--primary-purple); background: #fff; }
        .file-upload-box input { display: none; }
        .file-label { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--text-gray); }
        .btn-submit { width: 100%; padding: 16px; background: var(--primary-purple); color: #fff; border: none; border-radius: var(--radius-md); font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px; box-shadow: 0 4px 12px rgba(74, 44, 109, 0.2); }
        .btn-submit:hover { background: #3d235e; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="upload-card">
        <h2>上传应用 / 资源</h2>
        <p>分享您的作品，提供下载地址与说明文档。</p>
        <form id="createForm" enctype="multipart/form-data">
            <div class="form-group">
                <label>应用 / 资源名称</label>
                <input type="text" name="title" required placeholder="例如：AI 绘画助手 v1.0">
            </div>
            <div class="form-group">
                <label>分类</label>
                <select name="category">
                    <option value="AI工具">AI工具</option>
                    <option value="设计素材">设计素材</option>
                    <option value="开源代码">开源代码</option>
                    <option value="模型权重">模型权重</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>下载地址 (网盘或直链)</label>
                <input type="url" name="download_url" required placeholder="https://pan.baidu.com/s/xxxx 或 https://github.com/xxx.zip">
            </div>
            
            <div class="form-group">
                <label>应用封面图</label>
                <div class="file-upload-box">
                    <label class="file-label" for="cover_img"><i class="fa-regular fa-image" style="font-size:2rem;color:var(--primary-purple);"></i><span>点击上传封面图</span></label>
                    <input type="file" id="cover_img" name="cover_img" accept="image/*">
                </div>
            </div>
            <div class="form-group">
                <label>应用截图 (可多选)</label>
                <div class="file-upload-box">
                    <label class="file-label" for="screenshots"><i class="fa-regular fa-images" style="font-size:2rem;color:var(--primary-purple);"></i><span>点击上传多张截图</span></label>
                    <input type="file" id="screenshots" name="screenshots" accept="image/*" multiple>
                </div>
            </div>
            <div class="form-group">
                <label>主要功能介绍 (TXT说明文档)</label>
                <div class="file-upload-box">
                    <label class="file-label" for="doc_txt"><i class="fa-regular fa-file-lines" style="font-size:2rem;color:var(--primary-purple);"></i><span>点击上传 .txt 说明文档</span></label>
                    <input type="file" id="doc_txt" name="doc_txt" accept=".txt">
                </div>
            </div>
            <div class="form-group">
                <label>详细文字介绍</label>
                <textarea name="description" placeholder="在这里补充详细的应用说明、使用方法、系统要求等..."></textarea>
            </div>
            <button type="submit" class="btn-submit">立即发布</button>
        </form>
    </div>
    <script src="create.js"></script>
</body>
</html>
