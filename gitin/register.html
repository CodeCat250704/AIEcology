<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · AI项目生态</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <span class="logo-icon"><i class="fa-solid fa-cube"></i></span>
                    <span class="logo-text">AI项目生态</span>
                </div>
                <h2>创建新账号</h2>
                <p class="sub-text">加入我们，共同构建 AI 生态</p>
            </div>

            <!-- 注册表单 -->
            <form class="login-form" id="registerForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="email">邮箱 (用于接收通知)</label>
                    <input type="email" id="email" name="email" placeholder="请输入您的邮箱" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="至少 6 位" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="password_confirm">确认密码</label>
                    <input type="password" id="password_confirm" name="password_confirm" placeholder="再次输入密码" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-login-submit" id="registerBtn">立 即 注 册</button>
            </form>

            <!-- 登录引导 -->
            <div class="login-footer">
                已有账号？ <a href="/gitin/index.html">前往登录</a>
            </div>
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
