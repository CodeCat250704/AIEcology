<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 · AI项目生态</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <!-- 背景装饰波浪 -->
        <div class="ocean">
            <div class="wave"></div>
            <div class="wave"></div>
        </div>

        <!-- 核心卡片容器 -->
        <div class="container" id="container">
            
            <!-- 右侧：注册面板 -->
            <div class="form-container sign-up-container">
                <form id="registerForm">
                    <h1>创建账号</h1>
                    <div class="social-container">
                        <a href="/api/auth/github" class="social"><i class="fa-brands fa-github"></i></a>
                        <a href="#" class="social"><i class="fa-brands fa-google"></i></a>
                    </div>
                    <span>或使用邮箱注册</span>
                    <input type="text" name="username" placeholder="用户名" required />
                    <input type="email" name="email" placeholder="邮箱" required />
                    <input type="password" name="password" placeholder="密码" required />
                    <button type="submit" id="registerBtn">立即注册</button>
                </form>
            </div>

            <!-- 左侧：登录面板 -->
            <div class="form-container sign-in-container">
                <form id="loginForm">
                    <h1>欢迎回来</h1>
                    <div class="social-container">
                        <a href="/api/auth/github" class="social"><i class="fa-brands fa-github"></i></a>
                        <a href="#" class="social"><i class="fa-brands fa-google"></i></a>
                    </div>
                    <span>或使用您的账号登录</span>
                    <input type="text" id="loginUsername" name="username" placeholder="用户名 / 邮箱" required />
                    <input type="password" id="loginPassword" name="password" placeholder="密码" required />
                    <div class="captcha-box">
                        <input type="text" name="captcha" placeholder="图形验证码" required />
                        <img src="/api/auth/captcha" alt="验证码" class="captcha-img" id="captchaImg" title="点击刷新" onclick="this.src='/api/auth/captcha?t='+new Date().getTime()" />
                    </div>
                    <a href="#">忘记密码?</a>
                    <button type="submit" id="loginBtn">登 录</button>
                </form>
            </div>

            <!-- 覆盖层：交互切换 -->
            <div class="overlay-container">
                <div class="overlay">
                    <div class="overlay-panel overlay-left">
                        <h1>已有账号？</h1>
                        <p>直接登录，继续您的 AI 生态之旅</p>
                        <button class="ghost" id="signIn">前往登录</button>
                    </div>
                    <div class="overlay-panel overlay-right">
                        <h1>加入我们</h1>
                        <p>注册成为开发者，分享您的创意</p>
                        <button class="ghost" id="signUp">立即注册</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
