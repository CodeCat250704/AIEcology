<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布新作品</title>
    <link rel="stylesheet" href="publish.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="publish-card">
        <div class="publish-header">
            <h2>发布新作品</h2>
            <p>分享您的创意，让世界看见您的技术。</p>
        </div>
        <form id="createWorkForm" enctype="multipart/form-data">
            <div class="publish-body">
                <div class="left-col">
                    <div class="form-group">
                        <label for="title">作品名称</label>
                        <input type="text" id="title" name="title" required placeholder="例如：AI 绘画桌面助手">
                    </div>
                    <div class="form-group">
                        <label for="category">作品分类</label>
                        <select id="category" name="category">
                            <option value="AI工具">AI工具</option>
                            <option value="设计素材">设计素材</option>
                            <option value="开源项目">开源项目</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="project_url">项目地址 (GitHub/官网)</label>
                        <input type="url" id="project_url" name="project_url" placeholder="https://github.com/yourname/project">
                    </div>
                    <div class="form-group">
                        <label for="description">作品描述</label>
                        <textarea id="description" name="description" required placeholder="详细介绍您的作品亮点、功能、使用方法..."></textarea>
                    </div>
                </div>
                <div class="right-col">
                    <div class="form-group">
                        <label>作品封面 / 效果图</label>
                        <div class="file-upload-box" id="coverBox">
                            <label class="file-label" for="cover_img">
                                <i class="fa-regular fa-image"></i>
                                <span>点击上传封面图 (支持 JPG/PNG)</span>
                            </label>
                            <input type="file" id="cover_img" name="cover_img" accept="image/*">
                            <div class="file-name" id="coverFileName"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>说明文档 (TXT)</label>
                        <div class="file-upload-box" id="docBox">
                            <label class="file-label" for="doc_txt">
                                <i class="fa-regular fa-file-lines"></i>
                                <span>点击上传文档 (.txt 文件)</span>
                            </label>
                            <input type="file" id="doc_txt" name="doc_txt" accept=".txt">
                            <div class="file-name" id="docFileName"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="publish-footer">
                <button type="submit" class="btn-submit-work">立即发布作品</button>
            </div>
        </form>
    </div>
            <script>
        // 1. 定义独一无二的 API 地址（防止和全局变量冲突）
        const API_TARGET_URL = 'https://tapavesjpfegmieqsxrt.supabase.co/functions/v1/core-api';

        // 2. 封面图文件选择事件
        document.getElementById('cover_img').addEventListener('change', function(e) {
            const fileName = document.getElementById('coverFileName');
            if(this.files && this.files[0]) {
                fileName.textContent = '已选择: ' + this.files[0].name;
                fileName.style.display = 'inline-block';
                document.getElementById('coverBox').style.borderColor = '#4a2c6d';
            }
        });

        // 3. 文档文件选择事件
        document.getElementById('doc_txt').addEventListener('change', function(e) {
            const fileName = document.getElementById('docFileName');
            if(this.files && this.files[0]) {
                fileName.textContent = '已选择: ' + this.files[0].name;
                fileName.style.display = 'inline-block';
                document.getElementById('docBox').style.borderColor = '#4a2c6d';
            }
        });

        // 4. 提交表单事件
        document.getElementById('createWorkForm').addEventListener('submit', async function(event) {
            // 阻止表单默认提交导致页面刷新
            event.preventDefault();
            
            const btn = this.querySelector('.btn-submit-work');
            const originalText = btn.innerText;
            
            btn.innerText = "正在发布...";
            btn.disabled = true;

            // 构建 FormData
            const formData = new FormData(this);

            try {
                // 发送真实请求
                const response = await fetch(`${API_TARGET_URL}/works/create`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if(result.success) {
                    alert('🎉 作品发布成功！');
                    window.location.href = '/work/index.html';
                } else {
                    alert('发布失败: ' + result.message);
                }
            } catch (err) {
                // 如果出现网络错误，在这里显示
                console.error("网络错误:", err);
                alert('发布失败，请检查网络连接或控制台查看详情');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
